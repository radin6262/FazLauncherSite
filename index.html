<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faz Launcher | Classic Edition</title>
    <style>
        @font-face {
            font-family: 'OCR-A';
            src: local('OCR A Extended'), local('Courier New'), monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* CRT Scanline Effect */
        .crt-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(
                    rgba(18, 16, 16, 0) 50%,
                    rgba(0, 0, 0, 0.4) 50%
            );
            background-size: 100% 4px;
            z-index: 10;
            pointer-events: none;
            opacity: 0.8;
        }

        /* Classic Checkerboard Pattern Header */
        .checkerboard {
            width: 100%;
            max-width: 900px;
            height: 24px;
            background-image:
                    linear-gradient(45deg, #fff 25%, transparent 25%),
                    linear-gradient(-45deg, #fff 25%, transparent 25%),
                    linear-gradient(45deg, transparent 75%, #fff 75%),
                    linear-gradient(-45deg, transparent 75%, #fff 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            margin-bottom: 20px;
            border: 2px solid #333;
        }

        .wrapper {
            max-width: 900px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: left;
            width: 100%;
            margin-bottom: 25px;
        }

        h1 {
            font-family: 'OCR-A', 'Courier New', monospace;
            font-size: 2.8rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #fff;
            text-shadow: 2px 2px #ff0000, -2px -2px #0000ff;
        }

        .subtitle {
            color: #888;
            font-size: 0.9rem;
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Main Grid Frame */
        .main-content {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            width: 100%;
        }

        @media (min-width: 768px) {
            .main-content {
                grid-template-columns: 1.5fr 1fr;
            }
        }

        /* Camera Monitor Style Screenshot Box */
        .monitor-frame {
            border: 3px solid #555;
            background: #050505;
            padding: 10px;
            position: relative;
        }

        .monitor-header {
            display: flex;
            justify-content: space-between;
            color: #ff0000;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .recording-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: #ff0000;
            border-radius: 50%;
            margin-right: 5px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .screenshot-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #111;
            border: 1px solid #333;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .screenshot-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(30%) contrast(120%);
        }

        .camera-label {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 3px 8px;
            font-size: 0.8rem;
            border: 1px solid #555;
        }

        /* Control Panel Side */
        .panel {
            border: 3px solid #555;
            background: #0a0a0a;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .panel-title {
            color: #fff;
            font-size: 1.1rem;
            border-bottom: 1px dashed #444;
            padding-bottom: 8px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .info-list {
            list-style: none;
            font-size: 0.85rem;
            color: #ccc;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .info-list li::before {
            content: "> ";
            color: #ff0000;
        }

        /* Classic Static Button */
        .launch-btn {
            background: #000;
            color: #fff;
            border: 2px solid #fff;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            width: 100%;
            letter-spacing: 2px;
            transition: all 0.1s;
        }

        .launch-btn:hover {
            background: #fff;
            color: #000;
            box-shadow: 0 0 10px #fff;
        }

        .system-status {
            margin-top: 15px;
            font-size: 0.75rem;
            color: #555;
            text-align: center;
        }

        /* Modal Backdrop & Container */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: #050505;
            border: 3px solid #ff0000;
            max-width: 600px;
            width: 100%;
            padding: 20px;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.4);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .modal-title {
            color: #ff0000;
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .close-btn {
            background: transparent;
            border: 1px solid #555;
            color: #fff;
            padding: 2px 8px;
            cursor: pointer;
            font-family: monospace;
        }

        .close-btn:hover {
            background: #ff0000;
            color: #000;
        }

        /* Download Section Styling */
        .release-info {
            background: #000;
            border: 1px solid #333;
            padding: 12px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tag-badge {
            background: #ff0000;
            color: #000;
            font-weight: bold;
            padding: 2px 8px;
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        .release-name {
            color: #fff;
            font-size: 0.95rem;
            font-weight: bold;
        }

        .section-label {
            color: #888;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .file-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 300px;
            overflow-y: auto;
        }

        .file-item {
            border: 1px solid #333;
            padding: 12px;
            background: #0a0a0a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .file-item:hover {
            border-color: #fff;
        }

        .file-info {
            display: flex;
            flex-direction: column;
        }

        .file-name {
            color: #fff;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .file-meta {
            color: #666;
            font-size: 0.75rem;
            margin-top: 3px;
        }

        .dl-file-btn {
            background: #000;
            color: #fff;
            border: 1px solid #ff0000;
            padding: 8px 14px;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            cursor: pointer;
            text-decoration: none;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .dl-file-btn:hover {
            background: #ff0000;
            color: #000;
            font-weight: bold;
        }

        .loading-state, .error-state {
            text-align: center;
            padding: 20px;
            color: #888;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="crt-overlay"></div>

<div class="wrapper">
    <div class="checkerboard"></div>

    <header>
        <h1>FAZ_LAUNCHER</h1>
        <div class="subtitle">FAZLAUNCHER, a modern fnaf launcher</div>
    </header>

    <div class="main-content">
        <!-- Camera Monitor Section -->
        <div class="monitor-frame">
            <div class="monitor-header">
                <span><span class="recording-dot"></span>REC</span>
                <span>VIEWPORT</span>
            </div>
            <div class="screenshot-container">
                <img src="Preview.png" alt="Launcher Preview">
                <div class="camera-label">PC VIEWPORT</div>
            </div>
        </div>

        <!-- Control Panel Section -->
        <div class="panel">
            <div>
                <div class="panel-title">System Features</div>
                <ul class="info-list">
                    <li>DIRECT GAME EXECUTION</li>
                    <li>FAST DOWNLOADS</li>
                    <li>SECURE DOWNLOAD HOST</li>
                    <li>NO SECURITY RISKS</li>
                </ul>
            </div>

            <div>
                <button class="launch-btn" id="dlBtn">DOWNLOAD SYSTEM</button>
                <div class="system-status">MEMORY OK // WIN_X64</div>
            </div>
        </div>
    </div>

    <div class="checkerboard" style="margin-top: 20px;"></div>
</div>

<!-- Download Modal -->
<div class="modal-overlay" id="downloadModal">
    <div class="modal-box">
        <div class="modal-header">
            <div class="modal-title">> DOWNLOAD_MANAGER</div>
            <button class="close-btn" id="closeModal">X</button>
        </div>

        <div id="fileListContainer">
            <!-- Dynamic release and assets list -->
        </div>
    </div>
</div>

<script>
    const REMOTE_JSON_URL = "https://api.github.com/repos/radin6262/FazLauncherGit/releases/latest";

    const dlBtn = document.getElementById('dlBtn');
    const modal = document.getElementById('downloadModal');
    const closeModal = document.getElementById('closeModal');
    const fileListContainer = document.getElementById('fileListContainer');

    dlBtn.addEventListener('click', () => {
        modal.classList.add('active');
        fetchDownloads();
    });

    closeModal.addEventListener('click', () => modal.classList.remove('active'));
    modal.addEventListener('click', (e) => {
        if (e.target === modal) modal.classList.remove('active');
    });

    async function fetchDownloads() {
        fileListContainer.innerHTML = '<div class="loading-state">> QUERYING REMOTE DATABASE...</div>';

        try {
            const response = await fetch(REMOTE_JSON_URL);
            if (!response.ok) throw new Error('NETWORK_ERROR');

            const data = await response.json();
            renderReleaseView(data);
        } catch (err) {
            // Fallback object matching GitHub release schema
            renderReleaseView({
                tag_name: "win-v1.0",
                name: "FNAF Launcher - 1.0 Stable",
                assets: [
                    {
                        name: "fnaf-launcher-windows.zip",
                        size: 55616743,
                        download_count: 14,
                        browser_download_url: "https://github.com/radin6262/FazLauncherGit/releases/download/win-v1.0/fnaf-launcher-windows.zip"
                    }
                ]
            });
        }
    }

    function renderReleaseView(release) {
        const tag = release.tag_name || "v1.0";
        const title = release.name || "Release Package";
        const assets = release.assets || [];

        if (assets.length === 0) {
            fileListContainer.innerHTML = '<div class="error-state">> NO RELEASE FILES FOUND</div>';
            return;
        }

        const filesHTML = assets.map(file => {
            const sizeMB = file.size ? (file.size / (1024 * 1024)).toFixed(2) : "0.00";
            const downloads = file.download_count !== undefined ? file.download_count : 0;

            return `
              <div class="file-item">
                <div class="file-info">
                  <span class="file-name">${file.name}</span>
                  <span class="file-meta">SIZE: ${sizeMB} MB | DOWNLOADS: ${downloads}</span>
                </div>
                <a href="${file.browser_download_url}" class="dl-file-btn" target="_blank">DOWNLOAD</a>
              </div>
            `;
        }).join('');

        fileListContainer.innerHTML = `
            <div class="release-info">
                <span class="release-name">${title}</span>
                <span class="tag-badge">${tag}</span>
            </div>
            <div class="section-label">> FILES</div>
            <div class="file-list">
                ${filesHTML}
            </div>
        `;
    }
</script>

</body>
</html>
