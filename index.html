<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faz Launcher | Classic Edition</title>
    <style>
        @font-face {
            font-family: 'OCR-A';
            src: local('OCR A Extended'), local('Courier New'), monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* CRT Scanline & Flickering Effect */
        .crt-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(
                    rgba(18, 16, 16, 0) 50%,
                    rgba(0, 0, 0, 0.4) 50%
            );
            background-size: 100% 4px;
            z-index: 10;
            pointer-events: none;
            opacity: 0.8;
        }

        /* Classic Checkerboard Pattern Header */
        .checkerboard {
            width: 100%;
            max-width: 900px;
            height: 24px;
            background-image:
                    linear-gradient(45deg, #fff 25%, transparent 25%),
                    linear-gradient(-45deg, #fff 25%, transparent 25%),
                    linear-gradient(45deg, transparent 75%, #fff 75%),
                    linear-gradient(-45deg, transparent 75%, #fff 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            margin-bottom: 20px;
            border: 2px solid #333;
        }

        .wrapper {
            max-width: 900px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: left;
            width: 100%;
            margin-bottom: 25px;
        }

        h1 {
            font-family: 'OCR-A', 'Courier New', monospace;
            font-size: 2.8rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #fff;
            text-shadow: 2px 2px #ff0000, -2px -2px #0000ff;
        }

        .subtitle {
            color: #888;
            font-size: 0.9rem;
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Main Grid Frame */
        .main-content {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            width: 100%;
        }

        @media (min-width: 768px) {
            .main-content {
                grid-template-columns: 1.5fr 1fr;
            }
        }

        /* Camera Monitor Style Screenshot Box */
        .monitor-frame {
            border: 3px solid #555;
            background: #050505;
            padding: 10px;
            position: relative;
        }

        .monitor-header {
            display: flex;
            justify-content: space-between;
            color: #ff0000;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .recording-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: #ff0000;
            border-radius: 50%;
            margin-right: 5px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .screenshot-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #111;
            border: 1px solid #333;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .screenshot-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(30%) contrast(120%);
        }

        .camera-label {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 3px 8px;
            font-size: 0.8rem;
            border: 1px solid #555;
        }

        /* Control Panel Side */
        .panel {
            border: 3px solid #555;
            background: #0a0a0a;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .panel-title {
            color: #fff;
            font-size: 1.1rem;
            border-bottom: 1px dashed #444;
            padding-bottom: 8px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .info-list {
            list-style: none;
            font-size: 0.85rem;
            color: #ccc;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .info-list li::before {
            content: "> ";
            color: #ff0000;
        }

        /* Classic Static Button */
        .launch-btn {
            background: #000;
            color: #fff;
            border: 2px solid #fff;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            width: 100%;
            letter-spacing: 2px;
            transition: all 0.1s;
        }

        .launch-btn:hover {
            background: #fff;
            color: #000;
            box-shadow: 0 0 10px #fff;
        }

        .system-status {
            margin-top: 15px;
            font-size: 0.75rem;
            color: #555;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="crt-overlay"></div>

<div class="wrapper">
    <div class="checkerboard"></div>

    <header>
        <h1>FAZ_LAUNCHER</h1>
        <div class="subtitle">a modern launcher for fnaf</div>
    </header>

    <div class="main-content">
        <div class="monitor-frame">
            <div class="monitor-header">
                <span><span class="recording-dot"></span>REC</span>
                <span>VIEWPORT</span>
            </div>
            <div class="screenshot-container">
                <img src="https://via.placeholder.com/1280x720/000000/ffffff?text=LAUNCHER_SCREENSHOT.BMP" alt="Launcher Preview">
                <div class="camera-label">STAGE VIEW</div>
            </div>
        </div>

        <div class="panel">
            <div>
                <div class="panel-title">System Features</div>
                <ul class="info-list">
                    <li>DIRECT GAME EXECUTION</li>
                    <li>AUTOMATIC EXTRACTION</li>
                    <li>MODERN UI</li>
                    <li>FAST DOWNLOADING</li>
                </ul>
            </div>

            <div>
                <button class="launch-btn" id="dlBtn">Download</button>
                <div class="system-status">WIN_X64</div>
            </div>
        </div>
    </div>

    <div class="checkerboard" style="margin-top: 20px;"></div>
</div>

<script>
    document.getElementById('dlBtn').addEventListener('click', () => {
        window.location.href = "https://example.com";
    });
</script>

</body>
</html>
